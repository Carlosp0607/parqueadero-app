<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSystem - Mensualidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <script>
        if (!localStorage.getItem('token')) { window.location.href = '/'; }
    </script>
    <style>
      #placa { text-transform:uppercase; }
      #tbMens td:first-child {
        font-family:ui-monospace, Menlo, Consolas, monospace;
        font-weight:700; letter-spacing:.06em;
      }
      .bloque { border:1px solid #dee2e6; border-radius:.5rem; padding:1rem; }
      .bloque-titulo { font-weight:600; font-size:.9rem; color:#6c757d; margin-bottom:.75rem; }
      .eco { min-height:1.1rem; font-size:.85rem; }
      .total-pago { font-size:1.8rem; font-weight:700; }
    </style>
</head>
<body>
    <!-- El menú lo escribe public/js/menu.js. -->
    <div class="sidebar">
        <div class="sidebar-footer">
            <a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a>
        </div>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link"><i class="fas fa-user-circle me-2"></i><span id="userName">Usuario</span></span>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <div class="card">
                <div class="card-header bg-white d-flex flex-wrap gap-2 align-items-center justify-content-between">
                    <h5 class="mb-0">Mensualidades</h5>
                    <button id="btnNueva" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Nueva mensualidad
                    </button>
                </div>

                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-md-5">
                            <input id="q" type="text" class="form-control" placeholder="Buscar placa, titular o cédula…">
                        </div>
                        <div class="col-md-3">
                            <select id="estado" class="form-select">
                                <option value="">Todas</option>
                                <option value="activa">Al día</option>
                                <option value="vencida">Vencidas</option>
                                <option value="cancelada">Canceladas</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button id="btnBuscar" class="btn btn-outline-secondary w-100">Buscar</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Placa</th>
                                    <th>Titular</th>
                                    <th>Valor</th>
                                    <th>Desde</th>
                                    <th>Hasta</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbMens"></tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <button class="btn btn-outline-secondary btn-sm" id="btnPrev">Anterior</button>
                        <span class="small text-muted" id="pageInfo">Página 1</span>
                        <button class="btn btn-outline-secondary btn-sm" id="btnNext">Siguiente</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nueva / editar mensualidad -->
    <div class="modal fade" id="mensModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mensModalTitle">Nueva mensualidad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="mensForm">
                        <input type="hidden" id="id_mensualidad">

                        <div class="bloque mb-3">
                            <div class="bloque-titulo">Vehículo</div>
                            <div class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label">Placa</label>
                                    <input type="text" id="placa" class="form-control form-control-lg text-center"
                                           maxlength="10" autocomplete="off" placeholder="ABC123" required>
                                </div>
                                <div class="col-md-7">
                                    <label class="form-label">Tipo de vehículo</label>
                                    <select id="id_tipo" class="form-select">
                                        <option value="">Solo si el vehículo es nuevo</option>
                                    </select>
                                    <div class="form-text">Si la placa ya está registrada, déjalo así.</div>
                                </div>
                            </div>
                        </div>

                        <div class="bloque mb-3">
                            <div class="bloque-titulo">Titular</div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre completo</label>
                                    <input type="text" id="titular_nombre" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Cédula <span class="text-muted small">(opcional)</span></label>
                                    <input type="text" id="titular_documento" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono <span class="text-muted small">(opcional)</span></label>
                                    <input type="text" id="titular_telefono" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Correo <span class="text-muted small">(opcional)</span></label>
                                    <input type="email" id="titular_email" class="form-control">
                                </div>
                            </div>
                        </div>

                        <div class="bloque mb-3">
                            <div class="bloque-titulo">Plan</div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Cuánto paga al mes</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" min="0" step="1" id="valor_mensual" class="form-control" required>
                                    </div>
                                    <div class="eco text-muted" id="ecoValor"></div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Empieza el</label>
                                    <input type="date" id="fecha_inicio" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Termina el <span class="text-muted small">(opcional)</span></label>
                                    <input type="date" id="fecha_fin" class="form-control">
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="auto_renovar" checked>
                                        <label class="form-check-label" for="auto_renovar">
                                            Renovar sola cada mes
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Notas <span class="text-muted small">(opcional)</span></label>
                                    <textarea id="observaciones" class="form-control" rows="2"
                                              placeholder="Puesto asignado, acuerdos especiales…"></textarea>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Registrar pago -->
    <div class="modal fade" id="pagoMensModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="pagoMensForm">
                        <input type="hidden" id="pago_id_mensualidad">

                        <div class="mb-3">
                            <label class="form-label">¿Cuántos meses paga?</label>
                            <div class="input-group input-group-lg" style="max-width:14rem">
                                <button class="btn btn-outline-secondary" type="button" id="btnMesMenos">−</button>
                                <input type="number" id="months" class="form-control text-center" min="1" step="1" value="1">
                                <button class="btn btn-outline-secondary" type="button" id="btnMesMas">+</button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Queda cubierto</label>
                            <input type="text" id="periodo_label" class="form-control" disabled>
                        </div>

                        <div class="border-top border-bottom py-3 mb-3 text-center">
                            <div class="text-muted small">Total a recibir</div>
                            <div class="total-pago text-success" id="ecoMonto">$ 0</div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Monto</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" id="monto" class="form-control" min="0" step="1" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cómo paga</label>
                                <select id="metodo_pago" class="form-select">
                                    <option value="efectivo">Efectivo</option>
                                    <option value="tarjeta">Tarjeta</option>
                                    <option value="transferencia">Transferencia</option>
                                    <option value="QR">QR</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Referencia <span class="text-muted small">(opcional)</span></label>
                                <input type="text" id="referencia_pago" class="form-control"
                                       placeholder="Número de comprobante o transacción">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnRegPago">Registrar pago</button>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
        <div id="toastContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/turnos.js"></script>
    <script src="../js/mensualidades.js"></script>
    <script src="../js/menu.js"></script>
    <script>
    /* Solo detalles de la vista. El guardado sigue en mensualidades.js. */
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };

      function pesos(v) {
        var n = Math.round(Number(v) || 0);
        return '$ ' + n.toLocaleString('es-CO', { maximumFractionDigits: 0 });
      }

      var placa = $('placa');
      if (placa) placa.addEventListener('input', function () {
        var pos = this.selectionStart;
        this.value = this.value.toUpperCase();
        this.setSelectionRange(pos, pos);
      });

      var valor = $('valor_mensual'), ecoValor = $('ecoValor');
      if (valor && ecoValor) {
        var refValor = function () {
          var v = Number(valor.value) || 0;
          ecoValor.textContent = v > 0 ? pesos(v) + ' al mes' : '';
        };
        valor.addEventListener('input', refValor);
        refValor();
      }

      // Eco del total en el modal de pago. Lee el monto que calcula mensualidades.js.
      var monto = $('monto'), ecoMonto = $('ecoMonto');
      if (monto && ecoMonto) {
        var refMonto = function () { ecoMonto.textContent = pesos(monto.value); };
        monto.addEventListener('input', refMonto);
        ['btnMesMas', 'btnMesMenos'].forEach(function (b) {
          var el = $(b);
          if (el) el.addEventListener('click', function () { setTimeout(refMonto, 60); });
        });
        var meses = $('months');
        if (meses) meses.addEventListener('input', function () { setTimeout(refMonto, 60); });
        var pm = $('pagoMensModal');
        if (pm) pm.addEventListener('shown.bs.modal', refMonto);
        refMonto();
      }

      var mm = $('mensModal');
      if (mm) mm.addEventListener('shown.bs.modal', function () {
        if (placa) placa.focus();
      });
    })();
    </script>
</body>
</html>
