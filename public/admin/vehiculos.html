<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSystem - Vehículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <style>
      #placa, #filtroPlaca { text-transform:uppercase; }
      #vehiculosTable td:first-child {
        font-family:ui-monospace, Menlo, Consolas, monospace;
        font-weight:700; letter-spacing:.06em;
      }
      .barra-filtros { background:#f8f9fa; border-radius:.5rem; padding:.75rem; }
    </style>
</head>
<body>
    <!-- El menú lo escribe public/js/menu.js. Este btnLogout queda
         para que los scripts antiguos no fallen al buscarlo. -->
    <div class="sidebar">
        <div class="sidebar-footer">
            <a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a>
        </div>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link"><i class="fas fa-user-circle me-2"></i><span id="userName">Usuario</span></span>
                    </li>
                </ul>
                <!-- Enlace heredado, oculto. Algunos scripts antiguos lo buscan. -->
                <a href="#" id="logoutDropdown" class="d-none">Cerrar Sesión</a>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <div class="card">
                <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h5 class="mb-0">Vehículos registrados</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#vehiculoModal">
                        <i class="fas fa-plus me-2"></i>Agregar vehículo
                    </button>
                </div>

                <div class="card-body">
                    <div class="barra-filtros mb-3">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-5">
                                <input type="text" class="form-control" id="filtroPlaca" placeholder="Buscar placa…">
                            </div>
                            <div class="col-md-4">
                                <select class="form-select" id="filtroTipo">
                                    <option value="">Todos los tipos</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="vehiculosTable">
                            <thead class="table-light">
                                <tr>
                                    <th>Placa</th>
                                    <th>Tipo</th>
                                    <th>Color</th>
                                    <th>Modelo</th>
                                    <th>Fecha Registro</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Historial -->
    <div class="modal fade" id="historialModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Historial de <span id="histPlaca"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#Mov</th>
                                    <th>Entrada</th>
                                    <th>Salida</th>
                                    <th>Estado</th>
                                    <th>Total</th>
                                    <th>Pagos</th>
                                </tr>
                            </thead>
                            <tbody id="historialBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alta / edición -->
    <div class="modal fade" id="vehiculoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="vehiculoForm">
                        <input type="hidden" id="vehiculoId">

                        <div class="mb-3">
                            <label for="placa" class="form-label">Placa</label>
                            <input type="text" class="form-control form-control-lg text-center" id="placa"
                                   maxlength="10" autocomplete="off" placeholder="ABC123" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo de vehículo</label>
                            <select class="form-select" id="tipo" required>
                                <option value="">Cargando tipos...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">Color</label>
                            <input type="text" class="form-control" id="color" placeholder="Blanco, negro, rojo…" required>
                        </div>

                        <div class="mb-3">
                            <label for="modelo" class="form-label">Modelo <span class="text-muted small">(opcional)</span></label>
                            <input type="text" class="form-control" id="modelo" placeholder="Ej: Spark 2018">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
        <div id="toastContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/vehiculos.js"></script>
    <script src="../js/menu.js"></script>
    <script>
    /* Solo detalles de la vista. No toca el guardado: eso sigue en vehiculos.js. */
    (function () {
      'use strict';
      ['placa', 'filtroPlaca'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', function () {
          var pos = this.selectionStart;
          this.value = this.value.toUpperCase();
          this.setSelectionRange(pos, pos);
        });
      });

      var modal = document.getElementById('vehiculoModal');
      if (modal) modal.addEventListener('shown.bs.modal', function () {
        var p = document.getElementById('placa');
        if (p) p.focus();
      });
    })();
    </script>
</body>
</html>
