<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkSystem - Inicio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
<style>
  .lienzo { max-width:1100px; }
  .rotulo { font-size:.8rem; color:#8a94a0; letter-spacing:.02em; }
  .cifra { font-size:3rem; font-weight:600; line-height:1; letter-spacing:-.02em; }
  .cifra-sub { font-size:.8rem; color:#adb5bd; margin-top:.35rem; }
  .separador { border-left:1px solid #e9ecef; }
  .titulo-seccion { font-size:.9rem; font-weight:600; color:#495057; }
  .placa { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:600; letter-spacing:.05em; }
  .punto { width:.5rem; height:.5rem; border-radius:50%; display:inline-block; }
  .punto.on  { background:#198754; }
  .punto.off { background:#ced4da; }
  .vacio { padding:3rem 1rem; text-align:center; color:#adb5bd; }
  table.limpia { --bs-table-bg:transparent; }
  table.limpia th {
    font-weight:500; font-size:.75rem; color:#8a94a0;
    text-transform:uppercase; letter-spacing:.04em;
    border-bottom:1px solid #e9ecef; padding-bottom:.5rem;
  }
  table.limpia td { padding:.6rem 0; border-bottom:1px solid #f5f6f8; }
  table.limpia tr:last-child td { border-bottom:0; }
  .chip { font-size:.8rem; color:#6c757d; }
  .chip + .chip::before { content:'·'; margin:0 .5rem; color:#dee2e6; }
  @media (max-width: 767px){
    .separador { border-left:0; border-top:1px solid #e9ecef; padding-top:1rem; margin-top:1rem; }
    .cifra { font-size:2.25rem; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-footer">
    <a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a>
  </div>
</div>

<div class="main-content">

  <nav class="navbar navbar-expand-lg navbar-light bg-white">
    <div class="container-fluid">
      <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
      <span class="ms-2 d-flex align-items-center gap-2 small text-muted">
        <span class="punto off" id="puntoTurno"></span>
        <span id="textoTurno">Consultando…</span>
      </span>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <span class="nav-link small"><span id="userName">Usuario</span></span>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container py-5 lienzo">

    <div class="mb-5">
      <h4 class="mb-1" id="saludo">Hola</h4>
      <div class="text-muted small" id="fechaHoy"></div>
    </div>

    <!-- TRES CIFRAS -->
    <div class="row mb-5">
      <div class="col-md-4 mb-4 mb-md-0">
        <div class="rotulo">Adentro ahora</div>
        <div class="cifra" id="cAdentro">–</div>
        <div class="cifra-sub" id="subAdentro">&nbsp;</div>
      </div>
      <div class="col-md-4 separador mb-4 mb-md-0">
        <div class="ps-md-4">
          <div class="rotulo">Recaudado hoy</div>
          <div class="cifra text-success" id="cRecaudo">–</div>
          <div class="cifra-sub" id="subRecaudo">&nbsp;</div>
        </div>
      </div>
      <div class="col-md-4 separador">
        <div class="ps-md-4">
          <div class="rotulo">Debe haber en caja</div>
          <div class="cifra" id="cCaja">–</div>
          <div class="cifra-sub" id="subCaja">&nbsp;</div>
        </div>
      </div>
    </div>

    <!-- QUIÉN ESTÁ ADENTRO -->
    <div class="mb-2 d-flex align-items-baseline flex-wrap gap-2">
      <span class="titulo-seccion">Quién está adentro</span>
      <span class="ms-auto" id="chips"></span>
    </div>

    <div id="zonaTabla">
      <div class="vacio">Cargando…</div>
    </div>

    <div class="text-muted small mt-4" id="pie"></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================================
   Pantalla de solo lectura. No registra ni modifica nada.
   CFG - Rutas de API. Si alguna no coincide, se cambia SOLO aquí.
   ============================================================ */
const CFG = {
  stats       : '/api/dashboard/stats',
  turnoActual : '/api/turnos/actual',
  turnoResumen: '/api/turnos/resumen',
  activos     : '/api/movimientos/activos'
};

const $ = id => document.getElementById(id);

function pesos(v){
  return '$ ' + (Math.round(Number(v) || 0)).toLocaleString('es-CO', { maximumFractionDigits:0 });
}
function hora(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit', hour12:true });
}
function textoTiempo(desde){
  if(!desde) return '-';
  const ms = Date.now() - new Date(desde).getTime();
  if(ms < 0 || isNaN(ms)) return '-';
  const min = Math.floor(ms/60000), h = Math.floor(min/60), m = min%60;
  if(h >= 24){ const d = Math.floor(h/24); return d + (d===1?' día':' días'); }
  return h ? `${h} h ${m} min` : `${m} min`;
}

async function api(url){
  const headers = { 'Accept':'application/json' };
  const tok = localStorage.getItem('token') || localStorage.getItem('ps_token');
  if(tok) headers['Authorization'] = 'Bearer ' + tok;

  let res, cuerpo;
  try{
    res = await fetch(url, { headers, credentials:'include' });
    const crudo = await res.text();
    try { cuerpo = crudo ? JSON.parse(crudo) : {}; } catch { cuerpo = {}; }
  }catch(e){ throw new Error('Sin conexión.'); }

  if(!res.ok){
    console.warn('API', url, res.status, cuerpo);
    throw new Error(cuerpo.message || cuerpo.error || ('Respondió ' + res.status));
  }
  return cuerpo;
}
function lista(r){
  if(Array.isArray(r)) return r;
  for(const k of ['data','movimientos','activos','rows','items'])
    if(Array.isArray(r?.[k])) return r[k];
  if(r?.data && typeof r.data === 'object')
    for(const k of ['movimientos','rows','items'])
      if(Array.isArray(r.data[k])) return r.data[k];
  return [];
}
function campo(o, claves, def=null){
  for(const k of claves) if(o && o[k] !== undefined && o[k] !== null) return o[k];
  return def;
}

/* ---------- saludo ---------- */
(function(){
  const d = new Date();
  const h = d.getHours();
  $('saludo').textContent = h < 12 ? 'Buenos días' : (h < 19 ? 'Buenas tardes' : 'Buenas noches');
  $('fechaHoy').textContent = d.toLocaleDateString('es-CO',
    { weekday:'long', day:'numeric', month:'long' });
  try{
    const u = JSON.parse(localStorage.getItem('usuario') || localStorage.getItem('user') || 'null');
    const n = u && (u.nombre || u.usuario || u.username || u.nombre_usuario);
    if(n) $('userName').textContent = n;
  }catch(e){}
})();

/* ---------- estado ---------- */
let ABIERTO = false, TURNO = null, RESUMEN = null, ACTIVOS = [];

function recaudadoTurno(){
  const r = RESUMEN?.data || RESUMEN || {};
  const t = campo(r, ['total','total_recaudado','totalRecaudado','recaudado'], null);
  if(t !== null) return Number(t) || 0;
  const m = r.metodos || r.porMetodo || r.por_metodo;
  if(Array.isArray(m)) return m.reduce((a,x) => a + (Number(campo(x,['total','valor','monto'],0))||0), 0);
  if(m && typeof m === 'object') return Object.values(m).reduce((a,x) => a + (Number(x)||0), 0);
  return 0;
}

async function cargar(){
  // Turno
  try{
    const r = await api(CFG.turnoActual);
    const t = r.turno || r.data || r;
    ABIERTO = !!(t && (t.id || t.id_turno)) &&
              String(campo(t,['estado'],'abierto')).toLowerCase() === 'abierto';
    TURNO = ABIERTO ? t : null;
  }catch(e){ ABIERTO = false; TURNO = null; }

  RESUMEN = null;
  if(ABIERTO){ try{ RESUMEN = await api(CFG.turnoResumen); }catch(e){} }

  // Adentro
  try{ ACTIVOS = lista(await api(CFG.activos)); }catch(e){ ACTIVOS = []; }

  // Stats
  let d = {};
  try{ const s = await api(CFG.stats); d = s?.data || s || {}; }catch(e){}

  pintarBarra();
  pintarCifras(d);
  pintarTabla();
}

function pintarBarra(){
  const punto = $('puntoTurno'), texto = $('textoTurno');
  if(ABIERTO){
    const desde = campo(TURNO, ['fecha_apertura','hora_apertura','created_at','fecha_inicio']);
    punto.className = 'punto on';
    texto.textContent = 'Turno abierto desde ' + hora(desde);
  }else{
    punto.className = 'punto off';
    texto.textContent = 'Turno cerrado';
  }
}

function pintarCifras(d){
  // Adentro
  $('cAdentro').textContent = ACTIVOS.length;
  $('subAdentro').innerHTML = ACTIVOS.length
    ? ACTIVOS.length + (ACTIVOS.length === 1 ? ' vehículo' : ' vehículos')
    : 'El parqueadero está vacío';

  // Recaudado
  const rec = campo(d, ['ingresos_hoy','ingresosHoy','recaudado_hoy','total_hoy','ingresos'], null);
  const recNum = rec !== null ? Number(rec) : (ABIERTO ? recaudadoTurno() : null);
  $('cRecaudo').textContent = recNum !== null ? pesos(recNum) : '–';

  const atend = campo(d, ['movimientos_hoy','tickets','atendidos_hoy','salidas_hoy'], null);
  $('subRecaudo').textContent = atend
    ? atend + (atend === 1 ? ' vehículo atendido' : ' vehículos atendidos')
    : (recNum ? 'Desde que abrió el turno' : 'Todavía no hay cobros');

  // Caja
  if(ABIERTO){
    const base = Number(campo(TURNO, ['base_inicial','baseInicial','base'], 0)) || 0;
    const enCaja = base + recaudadoTurno();
    $('cCaja').textContent = pesos(enCaja);
    $('subCaja').textContent = 'Base ' + pesos(base) + ' más lo cobrado';
  }else{
    $('cCaja').textContent = '–';
    $('subCaja').innerHTML = 'Abre el turno en <a href="vehiculos.html">Vehículos</a>';
  }
}

function pintarTabla(){
  const zona = $('zonaTabla'), chips = $('chips');

  if(!ACTIVOS.length){
    chips.innerHTML = '';
    zona.innerHTML = '<div class="vacio">' +
      (ABIERTO
        ? 'Nadie ha entrado todavía. Registra la primera entrada en <a href="vehiculos.html">Vehículos</a>.'
        : 'El turno está cerrado. Ábrelo en <a href="vehiculos.html">Vehículos</a> para empezar el día.') +
      '</div>';
    $('pie').textContent = '';
    return;
  }

  // Chips por tipo
  const cuenta = {};
  ACTIVOS.forEach(m => {
    const t = campo(m,['tipo_vehiculo','tipo','nombre_tipo'],'Sin tipo');
    cuenta[t] = (cuenta[t] || 0) + 1;
  });
  chips.innerHTML = Object.keys(cuenta)
    .sort((a,b) => cuenta[b]-cuenta[a])
    .map(t => '<span class="chip">' + cuenta[t] + ' ' + t.toLowerCase() + '</span>')
    .join('');

  const orden = ACTIVOS.slice().sort((a,b) => {
    const fa = new Date(campo(a,['fecha_entrada','hora_entrada','entrada','created_at'],0)).getTime() || 0;
    const fb = new Date(campo(b,['fecha_entrada','hora_entrada','entrada','created_at'],0)).getTime() || 0;
    return fb - fa;
  });

  zona.innerHTML =
    '<table class="table limpia mb-0">' +
      '<thead><tr><th>Placa</th><th>Tipo</th><th>Entró</th><th class="text-end">Lleva</th></tr></thead>' +
      '<tbody>' +
      orden.slice(0, 20).map(m => {
        const ent = campo(m,['fecha_entrada','hora_entrada','entrada','created_at']);
        return '<tr>' +
          '<td class="placa">' + String(campo(m,['placa'],'-')).toUpperCase() + '</td>' +
          '<td class="text-muted">' + campo(m,['tipo_vehiculo','tipo','nombre_tipo'],'-') + '</td>' +
          '<td class="text-muted">' + hora(ent) + '</td>' +
          '<td class="text-end text-muted">' + textoTiempo(ent) + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table>';

  $('pie').textContent = orden.length > 20
    ? 'Se muestran 20 de ' + orden.length + '. La lista completa está en Vehículos.'
    : '';
}

(async function init(){
  await cargar();
  setInterval(cargar, 60000);
})();
</script>
<script src="../js/menu.js"></script>
</body>
</html>
