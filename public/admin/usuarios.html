<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSystem - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <script>
        // Guard: requiere token y rol admin
        if (!localStorage.getItem('token')) { window.location.href = '/'; }
        if (localStorage.getItem('userRole') !== 'admin') { window.location.href = '/admin/dashboard'; }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .card { border: none; box-shadow: 0 0 15px rgba(0,0,0,.05); }
        #usuario_login { font-family:ui-monospace, Menlo, Consolas, monospace; }
        .ayuda-rol { font-size:.85rem; }
    </style>
</head>
<body>
    <!-- El menú lo escribe public/js/menu.js. -->
    <div class="sidebar">
        <div class="sidebar-footer">
            <a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a>
        </div>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link"><i class="fas fa-user-circle me-2"></i><span id="userName">Usuario</span></span>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <div class="card">
                <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <h5 class="mb-0">Usuarios</h5>
                        <div class="text-muted small">Quiénes pueden entrar al sistema.</div>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#usuarioModal">
                        <i class="fas fa-user-plus me-2"></i>Nuevo usuario
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="usuariosTable">
                            <thead class="table-light">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Usuario</th>
                                    <th>Rol</th>
                                    <th>Activo</th>
                                    <th>Último acceso</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nuevo / editar usuario -->
    <div class="modal fade" id="usuarioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="usuarioModalTitle">Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="usuarioForm">
                        <input type="hidden" id="usuarioId">

                        <div class="mb-3">
                            <label class="form-label">Nombre de la persona</label>
                            <input type="text" id="nombre" class="form-control" required
                                   placeholder="María Rodríguez" autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Usuario para entrar</label>
                            <input type="text" id="usuario_login" class="form-control" required
                                   placeholder="maria" autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input type="password" id="contraseña" class="form-control" required>
                                <button class="btn btn-outline-secondary" type="button" id="verClave">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="form-text">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">¿Qué puede hacer?</label>
                            <select id="rol" class="form-select" required>
                                <option value="operador">Operador</option>
                                <option value="admin">Administrador</option>
                            </select>
                            <div class="ayuda-rol text-muted mt-2" id="ayudaRol"></div>
                        </div>

                        <div class="border-top pt-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="activo" checked>
                                <label class="form-check-label" for="activo">Puede entrar al sistema</label>
                            </div>
                            <div class="form-text">Apágalo en vez de borrar al usuario cuando alguien se va.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarUsuario">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cambio de contraseña -->
    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cambiar contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="passwordForm">
                        <input type="hidden" id="pwd_user_id">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" id="pwd_user_login" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <div class="input-group">
                                <input type="password" id="pwd_new" class="form-control" required>
                                <button class="btn btn-outline-secondary" type="button" id="pwd_toggle">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="form-text">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Escríbela otra vez</label>
                            <input type="password" id="pwd_confirm" class="form-control" required>
                            <div class="form-text" id="ecoConfirma"></div>
                        </div>

                        <div class="alert d-none" id="pwd_alert"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnPwdSave">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
        <div id="toastContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/usuarios.js"></script>
    <script src="../js/menu.js"></script>
    <script>
    /* Solo detalles de la vista. El guardado sigue en usuarios.js. */
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };

      var TEXTO_ROL = {
        operador: 'Registra entradas, cobra salidas y maneja el turno de caja. No ve tarifas, usuarios ni reportes.',
        admin:    'Todo lo del operador, más tarifas, usuarios, reportes y configuración del parqueadero.'
      };

      var rol = $('rol'), ayuda = $('ayudaRol');
      if (rol && ayuda) {
        var refRol = function () { ayuda.textContent = TEXTO_ROL[rol.value] || ''; };
        rol.addEventListener('change', refRol);
        var um = $('usuarioModal');
        if (um) um.addEventListener('shown.bs.modal', function () {
          refRol();
          var n = $('nombre');
          if (n) n.focus();
        });
        refRol();
      }

      // Botones de ver/ocultar contraseña.
      function alternar(idBoton, idCampo) {
        var b = $(idBoton), c = $(idCampo);
        if (!b || !c) return;
        b.addEventListener('click', function () {
          var oculto = c.type === 'password';
          c.type = oculto ? 'text' : 'password';
          var i = b.querySelector('i');
          if (i) i.className = oculto ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
      }
      alternar('verClave', 'contrase\u00f1a');
      alternar('pwd_toggle', 'pwd_new');

      // Aviso en vivo si las dos contraseñas no coinciden.
      var n1 = $('pwd_new'), n2 = $('pwd_confirm'), eco = $('ecoConfirma');
      if (n1 && n2 && eco) {
        var comparar = function () {
          if (!n2.value) { eco.textContent = ''; eco.className = 'form-text'; return; }
          var igual = n1.value === n2.value;
          eco.textContent = igual ? 'Coinciden.' : 'No coinciden.';
          eco.className = 'form-text ' + (igual ? 'text-success' : 'text-danger');
        };
        n1.addEventListener('input', comparar);
        n2.addEventListener('input', comparar);
      }
    })();
    </script>
</body>
</html>
