<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkSystem - Tarifas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="../css/dashboard.css" rel="stylesheet">
<style>
  .panel { background:#fff; border:1px solid #dee2e6; border-radius:.5rem; }
  .panel-cab { padding:.7rem 1rem; border-bottom:1px solid #dee2e6; font-weight:600; }
  .panel-cuerpo { padding:1rem; }
  .avisos { position:fixed; top:1rem; right:1rem; z-index:1080; width:22rem; max-width:calc(100vw - 2rem); }
  .item-tipo { padding:.75rem 1rem; border-bottom:1px solid #f1f3f5; cursor:pointer; }
  .item-tipo:hover { background:#f8f9fa; }
  .item-tipo.sel { background:#e7f1ff; border-left:3px solid #0d6efd; padding-left:calc(1rem - 3px); }
  .item-tipo.apagado { opacity:.5; }
  .precio-tipo { font-weight:600; }
  .sin-precio { color:#dc3545; font-size:.85rem; }
  .opcion-modo { cursor:pointer; }
  .opcion-modo.activa { border-color:#0d6efd !important; background:#f0f6ff; }
  .campo-precio input { font-size:1.25rem; font-weight:600; }
  .eco { min-height:1.1rem; font-size:.85rem; }
  .resumen { background:#f8f9fa; border-left:4px solid #0d6efd; }
</style>
</head>
<body>

<div class="avisos" id="avisos"></div>

<div class="sidebar">
  <div class="sidebar-footer">
    <a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a>
  </div>
</div>

<div class="main-content">

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <span class="nav-link"><i class="fas fa-user-circle me-2"></i><span id="userName">Usuario</span></span>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container-fluid py-4">
    <div class="row g-3">

      <!-- LISTA DE TIPOS -->
      <div class="col-12 col-xl-4">
        <div class="panel">
          <div class="panel-cab bg-light d-flex align-items-center">
            <span>Qué recibe el parqueadero</span>
            <button class="btn btn-sm btn-primary ms-auto" id="btnNuevoTipo">
              <i class="fas fa-plus me-1"></i>Tipo
            </button>
          </div>
          <div id="listaTipos">
            <div class="panel-cuerpo text-muted small">Cargando…</div>
          </div>
        </div>
        <div class="text-muted small mt-2 px-1">
          Toca un tipo para ponerle precio.
        </div>
      </div>

      <!-- EDITOR DE TARIFA -->
      <div class="col-12 col-xl-8">

        <div class="panel" id="sinTipo">
          <div class="panel-cuerpo text-center py-5">
            <i class="fas fa-hand-pointer fs-2 text-muted opacity-50 d-block mb-3"></i>
            <div class="text-muted">Escoge un tipo de vehículo de la izquierda.</div>
          </div>
        </div>

        <div id="editor" class="d-none">

          <!-- CABECERA DEL TIPO -->
          <div class="panel mb-3">
            <div class="panel-cuerpo d-flex align-items-center flex-wrap gap-3">
              <div>
                <h5 class="mb-0" id="tituloTipo">—</h5>
                <div class="text-muted small" id="subtituloTipo"></div>
              </div>
              <div class="ms-auto d-flex align-items-center gap-3">
                <div>
                  <label class="form-label small text-muted mb-1">Cupos</label>
                  <input type="number" class="form-control form-control-sm" id="tipoCupos"
                         min="0" placeholder="Sin límite" style="width:8rem">
                </div>
                <div class="form-check form-switch mt-3">
                  <input class="form-check-input" type="checkbox" id="tipoActivo">
                  <label class="form-check-label small" for="tipoActivo">Disponible</label>
                </div>
                <button class="btn btn-outline-secondary btn-sm mt-3" id="btnGuardarTipo">
                  Guardar tipo
                </button>
              </div>
            </div>
          </div>

          <!-- MODO -->
          <div class="panel mb-3">
            <div class="panel-cuerpo">
              <label class="form-label fw-semibold mb-3">¿Cómo se le cobra?</label>
              <div class="row g-2">
                <div class="col-6 col-md-3">
                  <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="minuto">
                    <span class="fw-semibold">Por minuto</span>
                    <div class="text-muted small">Paga lo que estuvo</div>
                  </label>
                </div>
                <div class="col-6 col-md-3">
                  <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="hora">
                    <span class="fw-semibold">Por hora</span>
                    <div class="text-muted small">Lo más común</div>
                  </label>
                </div>
                <div class="col-6 col-md-3">
                  <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="dia">
                    <span class="fw-semibold">Por día</span>
                    <div class="text-muted small">Estadías largas</div>
                  </label>
                </div>
                <div class="col-6 col-md-3">
                  <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="mixto">
                    <span class="fw-semibold">Combinado</span>
                    <div class="text-muted small">Cambia según el rato</div>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- PRECIOS -->
          <div class="panel mb-3">
            <div class="panel-cuerpo">
              <label class="form-label fw-semibold mb-3">¿Cuánto cobra?</label>
              <div class="row g-3">
                <div class="col-md-4 campo-precio" id="wrapMinuto">
                  <label class="form-label small text-muted">Cada minuto</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" min="0" step="1" id="valorMinuto" class="form-control" value="0">
                  </div>
                  <div class="eco text-muted" id="ecoMinuto"></div>
                </div>
                <div class="col-md-4 campo-precio" id="wrapHora">
                  <label class="form-label small text-muted">Cada hora</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" min="0" step="1" id="valorHora" class="form-control" value="0">
                  </div>
                  <div class="eco text-muted" id="ecoHora"></div>
                </div>
                <div class="col-md-4 campo-precio" id="wrapDia">
                  <label class="form-label small text-muted">Cada día</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" min="0" step="1" id="valorDia" class="form-control" value="0">
                  </div>
                  <div class="eco text-muted" id="ecoDia"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- COMBINADO -->
          <div class="panel mb-3 d-none" id="cardCombinado">
            <div class="panel-cuerpo">
              <label class="form-label fw-semibold mb-3">¿Cuándo cambia de precio?</label>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small text-muted">Cobra por minuto hasta los</label>
                  <div class="input-group">
                    <input type="number" min="0" step="1" id="pasoMinutos" class="form-control" value="0">
                    <span class="input-group-text">minutos</span>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-muted">Después por hora hasta las</label>
                  <div class="input-group">
                    <input type="number" min="0" step="1" id="pasoHoras" class="form-control" value="0">
                    <span class="input-group-text">horas</span>
                  </div>
                </div>
              </div>
              <div class="form-text mt-2">Pasadas esas horas, se cobra por día.</div>
            </div>
          </div>

          <!-- REDONDEO -->
          <div class="panel mb-3" id="cardRedondeo">
            <div class="panel-cuerpo">
              <label class="form-label fw-semibold mb-3">¿Cómo cuenta las fracciones?</label>
              <div class="row g-3">
                <div class="col-md-6" id="wrapRedHoras">
                  <label class="form-label small text-muted">Si lleva 1 hora y 5 minutos…</label>
                  <select id="redondeoHoras" class="form-select">
                    <option value="arriba">Cobra 2 horas completas</option>
                    <option value="exacto">Cobra solo 1 hora</option>
                  </select>
                </div>
                <div class="col-md-6" id="wrapRedDias">
                  <label class="form-label small text-muted">Si lleva 1 día y unas horas…</label>
                  <select id="redondeoDias" class="form-select">
                    <option value="arriba">Cobra 2 días completos</option>
                    <option value="exacto">Cobra solo 1 día</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <!-- RESUMEN -->
          <div class="panel mb-3 resumen">
            <div class="panel-cuerpo">
              <div class="text-muted small mb-1">Así va a quedar</div>
              <div id="resumenTarifa">—</div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mb-4">
            <button class="btn btn-outline-secondary" id="btnDescartar">Descartar cambios</button>
            <button class="btn btn-primary btn-lg" id="btnGuardarTarifa">
              <i class="fas fa-save me-2"></i>Guardar tarifa
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- NUEVO TIPO -->
<div class="modal fade" id="modalTipo" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Nuevo tipo de vehículo</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <label class="form-label">¿Cómo se llama?</label>
        <input class="form-control mb-3" id="nuevoNombre" placeholder="Camioneta" autocomplete="off">
        <label class="form-label">Cupos <span class="text-muted small">(opcional)</span></label>
        <input type="number" class="form-control" id="nuevoCupos" min="0" placeholder="Sin límite">
        <div class="form-text mt-2">Después le pones precio aquí mismo.</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" id="btnCrearTipo">Crear</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================================
   CFG - Rutas de API. Si alguna no coincide, se cambia SOLO aquí.
   ============================================================ */
const CFG = {
  tipos       : ['/api/tipos-vehiculos', '/api/tipos-vehiculos/activos', '/api/tipos-vehiculo'],
  tipoCrear   : '/api/tipos-vehiculos',
  tipoEditar  : '/api/tipos-vehiculos/',
  tarifas     : '/api/tarifas/current',
  tarifaGuardar: '/api/tarifas'
};

const $ = id => document.getElementById(id);

function pesos(v){
  return '$ ' + (Math.round(Number(v) || 0)).toLocaleString('es-CO', { maximumFractionDigits:0 });
}

function avisar(tipo, texto){
  const clase = { ok:'success', error:'danger', alerta:'warning' }[tipo] || 'secondary';
  const el = document.createElement('div');
  el.className = `alert alert-${clase} alert-dismissible shadow-sm py-2`;
  el.innerHTML = `<div class="small">${texto}</div>
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
  $('avisos').appendChild(el);
  setTimeout(() => el.remove(), tipo==='error' ? 9000 : 4000);
}

async function api(url, opciones = {}){
  const headers = { 'Accept':'application/json', ...(opciones.headers||{}) };
  if(opciones.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  const tok = localStorage.getItem('token') || localStorage.getItem('ps_token');
  if(tok) headers['Authorization'] = 'Bearer ' + tok;

  let res, cuerpo;
  try{
    res = await fetch(url, { ...opciones, headers, credentials:'include' });
    const crudo = await res.text();
    try { cuerpo = crudo ? JSON.parse(crudo) : {}; } catch { cuerpo = { message: crudo }; }
  }catch(e){ throw new Error('No hay conexión con el servidor.'); }

  if(res.status === 401 || res.status === 403)
    throw new Error(cuerpo.message || cuerpo.error || 'La sesión expiró. Vuelve a entrar.');
  if(!res.ok){
    console.error('API', url, res.status, cuerpo);
    const err = new Error(cuerpo.message || cuerpo.error || ('El servidor respondió ' + res.status));
    err.status = res.status;
    throw err;
  }
  return cuerpo;
}
async function apiPrimera(rutas, opciones){
  let ultimo;
  for(const r of rutas){
    try { return { ruta:r, datos: await api(r, opciones) }; }
    catch(e){ ultimo = e; if(e.status && e.status !== 404) throw e; }
  }
  throw ultimo || new Error('Ninguna ruta respondió.');
}
function lista(r){
  if(Array.isArray(r)) return r;
  for(const k of ['data','tipos','tarifas','rows','items','resultados'])
    if(Array.isArray(r?.[k])) return r[k];
  if(r?.data && typeof r.data === 'object')
    for(const k of ['tipos','tarifas','rows','items'])
      if(Array.isArray(r.data[k])) return r.data[k];
  return [];
}
function campo(o, claves, def=null){
  for(const k of claves) if(o && o[k] !== undefined && o[k] !== null) return o[k];
  return def;
}

const S = { tipos:[], tarifas:[], sel:null, rutaTipos:null };

/* ---------- carga ---------- */
function idTipo(t){ return campo(t,['id','id_tipo','id_tipo_vehiculo']); }
function nombreTipo(t){ return campo(t,['nombre','descripcion','tipo'],'Tipo ' + idTipo(t)); }
function activoTipo(t){ return Number(campo(t,['activo','estado','is_activo'],1)) ? true : false; }
function cuposTipo(t){ return campo(t,['capacidad','cupos','capacidad_total'], null); }

function tarifaDe(tipoId){
  return S.tarifas.find(x =>
    String(campo(x,['id_tipo_vehiculo','id_tipo','tipo_id','id_tipo_veh'])) === String(tipoId)) || null;
}

async function cargarTodo(){
  try{
    const { ruta, datos } = S.rutaTipos
      ? { ruta:S.rutaTipos, datos: await api(S.rutaTipos) }
      : await apiPrimera(CFG.tipos);
    S.rutaTipos = ruta;
    S.tipos = lista(datos);
  }catch(e){
    S.tipos = [];
    avisar('error','Tipos de vehículo: ' + e.message);
  }

  try{ S.tarifas = lista(await api(CFG.tarifas)); }
  catch(e){ S.tarifas = []; console.warn('tarifas:', e.message); }

  pintarLista();
}

function pintarLista(){
  const cont = $('listaTipos');
  if(!S.tipos.length){
    cont.innerHTML = '<div class="panel-cuerpo text-muted small">No hay tipos. Crea el primero con el botón Tipo.</div>';
    return;
  }

  cont.innerHTML = S.tipos.map(t => {
    const id = idTipo(t);
    const tf = tarifaDe(id);
    const act = activoTipo(t);
    const cup = cuposTipo(t);

    let precio;
    if(!tf){
      precio = '<span class="sin-precio"><i class="fas fa-triangle-exclamation me-1"></i>Sin precio</span>';
    }else{
      const modo = String(campo(tf,['modo_cobro','modo'],'mixto'));
      const v = modo === 'minuto' ? campo(tf,['valor_minuto'],0)
              : modo === 'dia'    ? campo(tf,['valor_dia_completo','valor_dia'],0)
              :                     campo(tf,['valor_hora'],0);
      const u = modo === 'minuto' ? '/min' : modo === 'dia' ? '/día' : '/hora';
      precio = '<span class="precio-tipo">' + pesos(v) + '</span><span class="text-muted small">' + u + '</span>';
    }

    return `<div class="item-tipo ${act ? '' : 'apagado'} ${String(S.sel)===String(id) ? 'sel' : ''}"
                 data-id="${id}">
              <div class="d-flex align-items-center">
                <div>
                  <div class="fw-semibold">${nombreTipo(t)}
                    ${act ? '' : '<span class="badge bg-secondary ms-1">Apagado</span>'}</div>
                  <div class="text-muted small">${cup ? cup + ' cupos' : 'Sin límite de cupos'}</div>
                </div>
                <div class="ms-auto text-end">${precio}</div>
              </div>
            </div>`;
  }).join('');

  cont.querySelectorAll('.item-tipo').forEach(el =>
    el.addEventListener('click', () => seleccionar(el.dataset.id)));
}

/* ---------- selección ---------- */
function seleccionar(id){
  S.sel = id;
  const t = S.tipos.find(x => String(idTipo(x)) === String(id));
  if(!t) return;

  $('sinTipo').classList.add('d-none');
  $('editor').classList.remove('d-none');

  $('tituloTipo').textContent = nombreTipo(t);
  const cod = campo(t,['codigo'],'');
  $('subtituloTipo').textContent = cod ? 'código: ' + cod : '';
  $('tipoCupos').value = cuposTipo(t) ?? '';
  $('tipoActivo').checked = activoTipo(t);

  const tf = tarifaDe(id);
  const modo = tf ? String(campo(tf,['modo_cobro','modo'],'hora')) : 'hora';

  $('valorMinuto').value = tf ? (campo(tf,['valor_minuto'],0) || 0) : 0;
  $('valorHora').value   = tf ? (campo(tf,['valor_hora'],0) || 0) : 0;
  $('valorDia').value    = tf ? (campo(tf,['valor_dia_completo','valor_dia'],0) || 0) : 0;
  $('pasoMinutos').value = tf ? (campo(tf,['paso_minutos_a_horas'],0) || 0) : 0;
  $('pasoHoras').value   = tf ? (campo(tf,['paso_horas_a_dias'],0) || 0) : 0;
  $('redondeoHoras').value = tf ? String(campo(tf,['redondeo_horas'],'arriba')) : 'arriba';
  $('redondeoDias').value  = tf ? String(campo(tf,['redondeo_dias'],'arriba')) : 'arriba';

  aplicarModo(modo);
  pintarLista();
  refrescarEcos();
}

/* ---------- modo ---------- */
let MODO = 'hora';

function mostrar(el, visible){
  if(!el) return;
  el.classList.toggle('d-none', !visible);
}

function aplicarModo(modo){
  MODO = modo;
  document.querySelectorAll('.opcion-modo').forEach(l =>
    l.classList.toggle('activa', l.dataset.modo === modo));

  mostrar($('wrapMinuto'), modo === 'minuto' || modo === 'mixto');
  mostrar($('wrapHora'),   modo === 'hora'   || modo === 'mixto');
  mostrar($('wrapDia'),    modo === 'dia'    || modo === 'mixto');

  mostrar($('cardCombinado'), modo === 'mixto');
  mostrar($('wrapRedHoras'),  modo === 'hora' || modo === 'mixto');
  mostrar($('wrapRedDias'),   modo === 'dia'  || modo === 'mixto');
  mostrar($('cardRedondeo'),  modo !== 'minuto');

  pintarResumen();
}

document.querySelectorAll('.opcion-modo').forEach(l =>
  l.addEventListener('click', () => aplicarModo(l.dataset.modo)));

/* ---------- ecos y resumen ---------- */
function eco(idIn, idEco, sufijo){
  const i = $(idIn), e = $(idEco);
  const f = () => {
    const v = Number(i.value) || 0;
    e.textContent = v > 0 ? pesos(v) + sufijo : '';
    pintarResumen();
  };
  i.addEventListener('input', f);
  return f;
}
const ecoMin = eco('valorMinuto','ecoMinuto',' por minuto');
const ecoHor = eco('valorHora','ecoHora',' por hora');
const ecoDia = eco('valorDia','ecoDia',' por día');
function refrescarEcos(){ ecoMin(); ecoHor(); ecoDia(); }

['pasoMinutos','pasoHoras','redondeoHoras','redondeoDias'].forEach(id => {
  $(id).addEventListener('input', pintarResumen);
  $(id).addEventListener('change', pintarResumen);
});

function pintarResumen(){
  if(!S.sel){ $('resumenTarifa').textContent = '—'; return; }
  const t = S.tipos.find(x => String(idTipo(x)) === String(S.sel));
  const nom = t ? nombreTipo(t) : 'este vehículo';

  const min = Number($('valorMinuto').value) || 0;
  const hor = Number($('valorHora').value) || 0;
  const dia = Number($('valorDia').value) || 0;
  const pM  = Number($('pasoMinutos').value) || 0;
  const pH  = Number($('pasoHoras').value) || 0;

  let t2;
  if(MODO === 'minuto')      t2 = 'A cada ' + nom + ' se le cobra ' + pesos(min) + ' por minuto.';
  else if(MODO === 'hora')   t2 = 'A cada ' + nom + ' se le cobra ' + pesos(hor) + ' por hora.';
  else if(MODO === 'dia')    t2 = 'A cada ' + nom + ' se le cobra ' + pesos(dia) + ' por día.';
  else t2 = 'A cada ' + nom + ': los primeros ' + pM + ' minutos a ' + pesos(min) +
            ' cada uno. De ahí hasta las ' + pH + ' horas, ' + pesos(hor) +
            ' la hora. Pasadas esas horas, ' + pesos(dia) + ' el día.';

  $('resumenTarifa').textContent = t2;
}

/* ---------- guardar tipo ---------- */
$('btnGuardarTipo').addEventListener('click', async () => {
  if(!S.sel) return;
  const btn = $('btnGuardarTipo');
  const cup = $('tipoCupos').value.trim();

  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    await api(CFG.tipoEditar + S.sel, { method:'PUT', body: JSON.stringify({
      capacidad: cup === '' ? null : Number(cup),
      activo: $('tipoActivo').checked ? 1 : 0
    })});
    avisar('ok','Tipo actualizado.');
    await cargarTodo();
    seleccionar(S.sel);
  }catch(e){ avisar('error', e.message); }
  finally{ btn.disabled = false; btn.textContent = 'Guardar tipo'; }
});

/* ---------- guardar tarifa ---------- */
$('btnGuardarTarifa').addEventListener('click', async () => {
  if(!S.sel) return avisar('alerta','Escoge un tipo primero.');
  const btn = $('btnGuardarTarifa');

  const min = Number($('valorMinuto').value) || 0;
  const hor = Number($('valorHora').value) || 0;
  const dia = Number($('valorDia').value) || 0;

  if(MODO === 'minuto' && min <= 0) return avisar('alerta','Pon el precio por minuto.');
  if(MODO === 'hora'   && hor <= 0) return avisar('alerta','Pon el precio por hora.');
  if(MODO === 'dia'    && dia <= 0) return avisar('alerta','Pon el precio por día.');
  if(MODO === 'mixto'  && (min <= 0 || hor <= 0 || dia <= 0))
    return avisar('alerta','En combinado hacen falta los tres precios.');

  btn.disabled = true; btn.innerHTML = 'Guardando…';
  try{
    await api(CFG.tarifaGuardar, { method:'PUT', body: JSON.stringify({
      id_tipo_vehiculo: S.sel,
      tipo_vehiculo: S.sel,
      modo_cobro: MODO,
      valor_minuto: min,
      valor_hora: hor,
      valor_dia_completo: dia,
      paso_minutos_a_horas: Number($('pasoMinutos').value) || 0,
      paso_horas_a_dias: Number($('pasoHoras').value) || 0,
      redondeo_horas: $('redondeoHoras').value,
      redondeo_dias: $('redondeoDias').value
    })});
    avisar('ok','Tarifa guardada.');
    await cargarTodo();
    seleccionar(S.sel);
  }catch(e){ avisar('error', e.message); }
  finally{ btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i>Guardar tarifa'; }
});

$('btnDescartar').addEventListener('click', () => { if(S.sel) seleccionar(S.sel); });

/* ---------- nuevo tipo ---------- */
$('btnNuevoTipo').addEventListener('click', () => {
  $('nuevoNombre').value = '';
  $('nuevoCupos').value = '';
  bootstrap.Modal.getOrCreateInstance($('modalTipo')).show();
});
$('modalTipo').addEventListener('shown.bs.modal', () => $('nuevoNombre').focus());

$('btnCrearTipo').addEventListener('click', async () => {
  const btn = $('btnCrearTipo');
  const nombre = $('nuevoNombre').value.trim();
  const cupos  = $('nuevoCupos').value.trim();
  if(!nombre) return avisar('alerta','Escribe el nombre del tipo.');

  const codigo = nombre.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');

  btn.disabled = true; btn.textContent = 'Creando…';
  try{
    await api(CFG.tipoCrear, { method:'POST', body: JSON.stringify({
      nombre, codigo, activo: 1,
      capacidad: cupos === '' ? null : Number(cupos)
    })});
    bootstrap.Modal.getInstance($('modalTipo')).hide();
    avisar('ok','Tipo "' + nombre + '" creado. Ahora ponle precio.');
    await cargarTodo();
    const nuevo = S.tipos.find(t => nombreTipo(t).toLowerCase() === nombre.toLowerCase());
    if(nuevo) seleccionar(idTipo(nuevo));
  }catch(e){ avisar('error', e.message); }
  finally{ btn.disabled = false; btn.textContent = 'Crear'; }
});

/* ---------- arranque ---------- */
(async function init(){
  await cargarTodo();
  const sinPrecio = S.tipos.filter(t => !tarifaDe(idTipo(t)));
  if(sinPrecio.length){
    avisar('alerta', sinPrecio.length === 1
      ? '"' + nombreTipo(sinPrecio[0]) + '" no tiene precio. No se le puede cobrar.'
      : sinPrecio.length + ' tipos no tienen precio. No se les puede cobrar.');
  }
})();
</script>
<script src="../js/menu.js"></script>
</body>
