<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSystem - Tarifas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <script>
        if (!localStorage.getItem('token')) { window.location.href = '/'; }
    </script>
    <style>
      .campo-precio input { font-size:1.25rem; font-weight:600; }
      .campo-precio .input-group-text { font-weight:600; }
      .eco { min-height:1.2rem; font-size:.85rem; }
      .opcion-modo { cursor:pointer; }
      .opcion-modo input { margin-right:.5rem; }
      .opcion-modo.activa { border-color:#0d6efd; background:#f0f6ff; }
      .resumen { background:#f8f9fa; border-left:4px solid #0d6efd; }
    </style>
</head>
<body>
    <!-- El contenido real lo escribe public/js/menu.js. Este btnLogout
         queda para que los scripts antiguos no fallen al buscarlo. -->
    <div class="sidebar">
        <div class="sidebar-footer"><a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a></div>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="navbar-collapse"><ul class="navbar-nav ms-auto"><li class="nav-item"><span class="nav-link"><i class="fas fa-user-circle me-2"></i><span id="userName">Usuario</span></span></li></ul></div>
            </div>
        </nav>

        <div class="container py-4">
            <div class="row g-4">

                <div class="col-12 col-xl-8">
                    <form id="tarifaForm">

                        <!-- PASO 1 -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <label class="form-label fw-semibold">¿Para qué vehículo?</label>
                                <select id="tipo_vehiculo" class="form-select form-select-lg" required>
                                    <option value="">Cargando tipos...</option>
                                </select>
                            </div>
                        </div>

                        <!-- PASO 2 -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <label class="form-label fw-semibold mb-3">¿Cómo se cobra?</label>

                                <div class="row g-2" id="modosCobro">
                                    <div class="col-6 col-md-3">
                                        <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="minuto">
                                            <input type="radio" name="modoUI" value="minuto">
                                            <span class="fw-semibold">Por minuto</span>
                                            <div class="text-muted small">Paga lo que estuvo</div>
                                        </label>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="hora">
                                            <input type="radio" name="modoUI" value="hora">
                                            <span class="fw-semibold">Por hora</span>
                                            <div class="text-muted small">Lo más común</div>
                                        </label>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="dia">
                                            <input type="radio" name="modoUI" value="dia">
                                            <span class="fw-semibold">Por día</span>
                                            <div class="text-muted small">Estadías largas</div>
                                        </label>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <label class="border rounded p-2 d-block opcion-modo h-100" data-modo="mixto">
                                            <input type="radio" name="modoUI" value="mixto">
                                            <span class="fw-semibold">Combinado</span>
                                            <div class="text-muted small">Cambia según el rato</div>
                                        </label>
                                    </div>
                                </div>

                                <select id="modo_cobro" class="d-none">
                                    <option value="mixto">Mixto</option>
                                    <option value="minuto">Por minuto</option>
                                    <option value="hora">Por hora</option>
                                    <option value="dia">Por día</option>
                                </select>
                            </div>
                        </div>

                        <!-- PASO 3 -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <label class="form-label fw-semibold mb-3">¿Cuánto cobra?</label>

                                <div class="row g-3">
                                    <div class="col-md-4 campo-precio" id="wrapMinuto">
                                        <label class="form-label small text-muted">Cada minuto</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="number" min="0" step="1" id="valor_minuto" class="form-control" value="0">
                                        </div>
                                        <div class="eco text-muted" id="ecoMinuto"></div>
                                    </div>

                                    <div class="col-md-4 campo-precio" id="wrapHora">
                                        <label class="form-label small text-muted">Cada hora</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="number" min="0" step="1" id="valor_hora" class="form-control" value="0">
                                        </div>
                                        <div class="eco text-muted" id="ecoHora"></div>
                                    </div>

                                    <div class="col-md-4 campo-precio" id="wrapDia">
                                        <label class="form-label small text-muted">Cada día</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="number" min="0" step="1" id="valor_dia_completo" class="form-control" value="0">
                                        </div>
                                        <div class="eco text-muted" id="ecoDia"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- PASO 4: solo en combinado -->
                        <div class="card mb-3" id="cardCombinado">
                            <div class="card-body">
                                <label class="form-label fw-semibold mb-3">¿Cuándo cambia de precio?</label>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted">Cobra por minuto hasta los</label>
                                        <div class="input-group">
                                            <input type="number" min="0" step="1" id="paso_minutos_a_horas" class="form-control" value="0">
                                            <span class="input-group-text">minutos</span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small text-muted">Después cobra por hora hasta las</label>
                                        <div class="input-group">
                                            <input type="number" min="0" step="1" id="paso_horas_a_dias" class="form-control" value="0">
                                            <span class="input-group-text">horas</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-text mt-2">Pasadas esas horas, se cobra por día.</div>
                            </div>
                        </div>

                        <!-- PASO 5 -->
                        <div class="card mb-3" id="cardRedondeo">
                            <div class="card-body">
                                <label class="form-label fw-semibold mb-3">¿Cómo cuenta las fracciones?</label>

                                <div class="row g-3">
                                    <div class="col-md-6" id="wrapRedHoras">
                                        <label class="form-label small text-muted">Si lleva 1 hora y 5 minutos…</label>
                                        <select id="redondeo_horas" class="form-select">
                                            <option value="arriba">Cobra 2 horas completas</option>
                                            <option value="exacto">Cobra solo 1 hora</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6" id="wrapRedDias">
                                        <label class="form-label small text-muted">Si lleva 1 día y unas horas…</label>
                                        <select id="redondeo_dias" class="form-select">
                                            <option value="arriba">Cobra 2 días completos</option>
                                            <option value="exacto">Cobra solo 1 día</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- RESUMEN -->
                        <div class="card mb-3 resumen">
                            <div class="card-body">
                                <div class="text-muted small mb-1">Así va a quedar</div>
                                <div id="resumenTarifa">Escoge un vehículo para empezar.</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>Guardar tarifa
                            </button>
                        </div>

                    </form>
                </div>

                <!-- TARIFAS ACTIVAS -->
                <div class="col-12 col-xl-4">
                    <div class="card">
                        <div class="card-header bg-white"><h6 class="mb-0">Tarifas guardadas</h6></div>
                        <div class="card-body">
                            <ul class="list-group" id="listaTarifas"></ul>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
        <div id="toastContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/tarifas.js"></script>
    <script src="../js/menu.js"></script>
    <script>
    /* ------------------------------------------------------------
       Solo maneja la vista. No toca el envio: eso sigue en tarifas.js.
       Todos los id originales se conservan.
       ------------------------------------------------------------ */
    (function () {
      'use strict';

      var $ = function (id) { return document.getElementById(id); };

      function pesos(v) {
        var n = Math.round(Number(v) || 0);
        return '$ ' + n.toLocaleString('es-CO', { maximumFractionDigits: 0 });
      }

      function modoActual() { return $('modo_cobro').value || 'mixto'; }

      function mostrar(el, visible) {
        if (!el) return;
        el.classList.toggle('d-none', !visible);
        el.querySelectorAll('input, select').forEach(function (c) {
          c.disabled = !visible;   // deshabilitado no se envia ni bloquea la validacion
        });
      }

      function aplicarModo(modo) {
        $('modo_cobro').value = modo;

        document.querySelectorAll('.opcion-modo').forEach(function (l) {
          var activa = l.dataset.modo === modo;
          l.classList.toggle('activa', activa);
          var r = l.querySelector('input');
          if (r) r.checked = activa;
        });

        mostrar($('wrapMinuto'), modo === 'minuto' || modo === 'mixto');
        mostrar($('wrapHora'),   modo === 'hora'   || modo === 'mixto');
        mostrar($('wrapDia'),    modo === 'dia'    || modo === 'mixto');

        $('cardCombinado').classList.toggle('d-none', modo !== 'mixto');
        $('cardCombinado').querySelectorAll('input').forEach(function (c) {
          c.disabled = (modo !== 'mixto');
        });

        mostrar($('wrapRedHoras'), modo === 'hora' || modo === 'mixto');
        mostrar($('wrapRedDias'),  modo === 'dia'  || modo === 'mixto');
        $('cardRedondeo').classList.toggle('d-none', modo === 'minuto');

        pintarResumen();
      }

      document.querySelectorAll('.opcion-modo').forEach(function (l) {
        l.addEventListener('click', function () { aplicarModo(l.dataset.modo); });
      });

      // Si tarifas.js carga una tarifa existente y cambia el select oculto.
      $('modo_cobro').addEventListener('change', function () { aplicarModo(this.value); });

      function pintarResumen() {
        var tipo = $('tipo_vehiculo');
        var nom  = tipo.selectedIndex >= 0 ? tipo.options[tipo.selectedIndex].text : '';
        if (!tipo.value) { $('resumenTarifa').textContent = 'Escoge un vehículo para empezar.'; return; }

        var modo = modoActual();
        var min  = Number($('valor_minuto').value) || 0;
        var hor  = Number($('valor_hora').value) || 0;
        var dia  = Number($('valor_dia_completo').value) || 0;
        var pMin = Number($('paso_minutos_a_horas').value) || 0;
        var pHor = Number($('paso_horas_a_dias').value) || 0;

        var t = '';
        if (modo === 'minuto') {
          t = 'A cada ' + nom + ' se le cobra ' + pesos(min) + ' por minuto.';
        } else if (modo === 'hora') {
          t = 'A cada ' + nom + ' se le cobra ' + pesos(hor) + ' por hora.';
        } else if (modo === 'dia') {
          t = 'A cada ' + nom + ' se le cobra ' + pesos(dia) + ' por día.';
        } else {
          t = 'A cada ' + nom + ': los primeros ' + pMin + ' minutos a ' + pesos(min) +
              ' cada uno. De ahí hasta las ' + pHor + ' horas, ' + pesos(hor) +
              ' la hora. Pasadas esas horas, ' + pesos(dia) + ' el día.';
        }
        $('resumenTarifa').textContent = t;
      }

      function eco(idInput, idEco, sufijo) {
        var i = $(idInput), e = $(idEco);
        if (!i || !e) return;
        var refrescar = function () {
          var v = Number(i.value) || 0;
          e.textContent = v > 0 ? pesos(v) + sufijo : '';
          pintarResumen();
        };
        i.addEventListener('input', refrescar);
        refrescar();
      }

      eco('valor_minuto',       'ecoMinuto', ' por minuto');
      eco('valor_hora',         'ecoHora',   ' por hora');
      eco('valor_dia_completo', 'ecoDia',    ' por día');

      ['tipo_vehiculo','paso_minutos_a_horas','paso_horas_a_dias','redondeo_horas','redondeo_dias']
        .forEach(function (id) {
          var el = $(id);
          if (el) { el.addEventListener('input', pintarResumen); el.addEventListener('change', pintarResumen); }
        });

      // Estado inicial. Se reevalua tras un momento por si tarifas.js precarga datos.
      aplicarModo($('modo_cobro').value || 'hora');
      setTimeout(function () { aplicarModo($('modo_cobro').value || 'hora'); }, 800);
    })();
    </script>
</body>
</html>
